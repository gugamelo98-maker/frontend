<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GM Cred · Escritório</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try {
      if (localStorage.getItem('gmcred_tema') === 'escuro') {
        document.documentElement.dataset.tema = 'escuro';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <!-- LOGIN -->
  <div class="login-veu" id="login">
    <div class="login-box">
      <div class="logo-lg">GM</div>
      <h1>GM Cred · Escritório</h1>
      <p>Digite a chave de acesso para ver os dados reais</p>
      <input type="password" id="chaveIn" placeholder="Chave de acesso" autocomplete="current-password" />
      <div class="chave-err" id="chaveErr"></div>
      <button class="btn-pri" id="btnEntrar">Entrar</button>
      <button class="btn-sec" id="btnDemo">Ver demonstração</button>
    </div>
  </div>

  <!-- TOPO -->
  <header class="top">
    <div class="marca">
      <div class="logo">GM</div>
      <div>
        <h1 id="pgTit">Escritório</h1>
        <p id="pgSub">GM Cred · Painel</p>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><b id="kAnd">—</b><span>Em andamento</span></div>
      <div class="kpi"><b id="kPag">—</b><span>Pagos hoje</span></div>
      <div class="kpi"><b id="kPar">—</b><span>Parados</span></div>
    </div>

    <div class="upd" id="upd"></div>

    <button class="conn off" id="connBtn">
      <i></i>
      <span id="connTxt">Offline</span>
    </button>
  </header>

  <div class="aviso" id="aviso" style="display:none"></div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav" id="nav">
        <button class="nv ativo" data-view="escritorio"><span class="ico">🏢</span><span class="lb">Escritório</span></button>
        <button class="nv" data-view="clientes"><span class="ico">👥</span><span class="lb">Clientes</span><span class="badge" id="navBadge" hidden>0</span></button>
        <button class="nv" data-view="agentes"><span class="ico">🤖</span><span class="lb">Agentes</span></button>
        <button class="nv" data-view="conversas"><span class="ico">💬</span><span class="lb">Conversas</span></button>
        <button class="nv" data-view="financeiro"><span class="ico">💰</span><span class="lb">Financeiro</span></button>
        <button class="nv" data-view="numeros"><span class="ico">📱</span><span class="lb">Números</span></button>
      </nav>
      <div class="sb-fim">
        <button class="nv" id="btnTema"><span class="ico">🌓</span><span class="lb">Tema</span></button>
        <button class="nv" id="btnTeste"><span class="ico">🧪</span><span class="lb">Testes</span></button>
        <button class="nv" id="btnSair"><span class="ico">🚪</span><span class="lb">Sair</span></button>
      </div>
    </aside>

    <main class="content">
      <!-- ESCRITÓRIO -->
      <div class="view ativo" id="v-escritorio">
        <section class="atencao" id="atencao" hidden>
          <h3>⚠️ Precisa da sua atenção</h3>
          <div id="listaAtencao"></div>
        </section>

        <section class="escritorio">
          <div class="salas" id="salas"></div>
        </section>

        <section class="clientes-rapido">
          <div class="sec-topo">
            <h3>Clientes no escritório</h3>
            <div class="chips" id="filtroSalas"></div>
          </div>
          <div class="lista-clientes" id="listaClientes"></div>
        </section>
      </div>

      <!-- CLIENTES -->
      <div class="view" id="v-clientes" hidden>
        <div class="fbox">
          <div class="crm-topo">
            <h2>Clientes</h2>
            <input type="search" id="crmBusca" placeholder="Buscar nome, CPF ou telefone..." />
          </div>
          <div class="chips" id="crmChips"></div>
          <div id="crmLista" class="crm-lista"></div>
        </div>
      </div>

      <!-- AGENTES -->
      <div class="view" id="v-agentes" hidden>
        <div class="fbox">
          <h2>Agentes</h2>
          <div class="ag-resumo" id="agResumo"></div>
          <div class="ag-cards" id="agSetores"></div>
        </div>
      </div>

      <!-- CONVERSAS / EVENTOS -->
      <div class="view" id="v-conversas" hidden>
        <div class="fbox">
          <h2>Últimos eventos</h2>
          <div id="listaConversas" class="lista-conversas"></div>
        </div>
      </div>

      <!-- FINANCEIRO -->
      <div class="view" id="v-financeiro" hidden>
        <div class="fbox">
          <h2>Financeiro</h2>
          <div class="fin-kpis" id="finKpis"></div>
          <div id="finTabela" class="tabela-wrap"></div>
        </div>
      </div>

      <!-- NÚMEROS -->
      <div class="view" id="v-numeros" hidden>
        <div class="fbox">
          <h2>Números WhatsApp</h2>
          <div id="numerosLista" class="numeros-grid"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-veu" id="modal" hidden>
    <div class="modal">
      <header>
        <h3 id="modalTitulo">Detalhe</h3>
        <button class="fechar" id="modalFechar">✕</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
